<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Escala de Ministérios - Igreja Evangélica Cristã Abba Pai</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-color: #4a2c8a;
            --primary-light: #6b4cb0;
            --primary-dark: #2e1a5e;
            --accent-color: #f5b342;
            --bg-color: #f8f6fc;
            --card-bg: #ffffff;
            --text-primary: #2d2d2d;
            --text-secondary: #5a5a5a;
            --border-color: #e0d8f0;
            --shadow: 0 2px 8px rgba(74, 44, 138, 0.10);
            --shadow-lg: 0 4px 16px rgba(74, 44, 138, 0.15);
            --radius: 12px;
            --success: #2e9e5b;
            --warning: #e6a100;
            --danger: #d63c3c;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 16px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow-lg);
            color: #fff;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        header h1 i {
            color: var(--accent-color);
            font-size: 1.3rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Navegação por meses */
        .month-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            margin-bottom: 12px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .month-nav::-webkit-scrollbar { height: 4px; }
        .month-nav::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 4px; }

        .month-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .month-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-color);
        }

        .month-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 3px 10px rgba(74, 44, 138, 0.3);
        }

        /* Cartões */
        .schedule-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .schedule-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .schedule-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-header {
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            color: #fff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-date {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            flex-wrap: wrap;
        }

        .card-date i {
            color: var(--accent-color);
            font-size: 1rem;
        }

        .card-day {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.9rem;
        }

        .card-event {
            background: var(--accent-color);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Grid de ministérios */
        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }

        .ministry-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-color);
            border-radius: 10px;
            border-left: 4px solid var(--primary-light);
            transition: background 0.2s ease;
        }

        .ministry-item:hover {
            background: #efe9fa;
        }

        /* Cores específicas por ministério */
        .ministry-item[data-role="palavra"] { border-left-color: #8e44ad; }
        .ministry-item[data-role="oferta"] { border-left-color: #16a085; }
        .ministry-item[data-role="louvor"] { border-left-color: #e67e22; }
        .ministry-item[data-role="intercessao"] { border-left-color: #2980b9; }
        .ministry-item[data-role="recepcao"] { border-left-color: #c0392b; }
        .ministry-item[data-role="audiovisual"] { border-left-color: #34495e; }
        .ministry-item[data-role="midia"] { border-left-color: #d35400; }
        .ministry-item[data-role="kids"] { border-left-color: #27ae60; }
        .ministry-item[data-role="babykids"] { border-left-color: #e84393; }

        .ministry-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary-color);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .ministry-item[data-role="palavra"] .ministry-icon { background: #8e44ad; }
        .ministry-item[data-role="oferta"] .ministry-icon { background: #16a085; }
        .ministry-item[data-role="louvor"] .ministry-icon { background: #e67e22; }
        .ministry-item[data-role="intercessao"] .ministry-icon { background: #2980b9; }
        .ministry-item[data-role="recepcao"] .ministry-icon { background: #c0392b; }
        .ministry-item[data-role="audiovisual"] .ministry-icon { background: #34495e; }
        .ministry-item[data-role="midia"] .ministry-icon { background: #d35400; }
        .ministry-item[data-role="kids"] .ministry-icon { background: #27ae60; }
        .ministry-item[data-role="babykids"] .ministry-icon { background: #e84393; }

        .ministry-info {
            flex: 1;
            min-width: 0;
        }

        .ministry-name {
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }

        .ministry-people {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.45;
            word-wrap: break-word;
        }

        .ministry-people .person {
            display: inline-block;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 2px 9px;
            border-radius: 14px;
            margin: 2px 3px 2px 0;
            font-size: 0.82rem;
            color: var(--text-primary);
        }

        .ministry-people .empty {
            color: #999;
            font-style: italic;
            font-size: 0.85rem;
        }

        /* Observações */
        .observation {
            background: #fff8e6;
            border-left: 4px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #7a5a00;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .observation i {
            color: var(--accent-color);
            margin-top: 2px;
        }

        .observation strong {
            color: #5a4100;
        }

        /* Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status-badge.status-confirmado {
            background: #e6f7ee;
            color: var(--success);
            border: 1px solid #b8e6c9;
        }
        .status-badge.status-pendente {
            background: #fff5e0;
            color: var(--warning);
            border: 1px solid #ffe0a3;
        }
        .status-badge.status-atencao {
            background: #fde8e8;
            color: var(--danger);
            border: 1px solid #f5b8b8;
        }
        .status-badge.status-default {
            background: #eee;
            color: #555;
            border: 1px solid #ccc;
        }

        .status-line {
            display: flex;
            justify-content: flex-end;
            padding-top: 4px;
            border-top: 1px dashed var(--border-color);
            margin-top: 4px;
        }

        /* Estado vazio */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 2px dashed var(--border-color);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: var(--primary-light);
            margin-bottom: 12px;
            opacity: 0.6;
        }

        footer {
            text-align: center;
            padding: 24px 16px 12px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            line-height: 1.6;
        }

        footer i { color: var(--primary-color); }

        @media (max-width: 480px) {
            body { padding: 8px; }
            header h1 { font-size: 1.2rem; }
            header p { font-size: 0.82rem; }
            .card-header { padding: 12px 14px; }
            .card-date { font-size: 0.92rem; }
            .card-body { padding: 14px; }
            .ministry-grid { grid-template-columns: 1fr; }
            .ministry-item { padding: 8px 10px; }
            .ministry-icon { width: 32px; height: 32px; font-size: 0.85rem; }
            .ministry-name { font-size: 0.74rem; }
            .ministry-people { font-size: 0.86rem; }
        }

        .month-btn:focus-visible,
        .schedule-card:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>

        };

        // Definição dos ministérios (label, ícone e chave nos dados)
        const ministriesConfig = [
            { key: "palavra",    label: "Palavra",     icon: "fa-bible" },
            { key: "oferta",     label: "Oferta",      icon: "fa-hand-holding-usd" },
            { key: "louvor",     label: "Louvor",      icon: "fa-music" },
            { key: "intercessao",label: "Intercessão", icon: "fa-praying-hands" },
            { key: "recepcao",   label: "Recepção",    icon: "fa-handshake" },
            { key: "audiovisual",label: "AudioVisual", icon: "fa-headphones" },
            { key: "midia",      label: "Mídia",       icon: "fa-video" },
            { key: "kids",       label: "Kids",        icon: "fa-child" },
            { key: "babykids",   label: "Babykids",    icon: "fa-baby" }
        ];

        const scheduleContainer = document.getElementById('scheduleContainer');
        const monthButtons = document.querySelectorAll('.month-btn');

        // Função auxiliar para renderizar lista de pessoas
        function renderPeople(people) {
            if (!people || people.length === 0) {
                return '<span class="empty">A definir</span>';
            }
            return people.map(p => `<span class="person">${p}</span>`).join('');
        }

        // Retorna a classe CSS de acordo com o status
        function getStatusClass(status) {
            const s = (status || "").toLowerCase().trim();
            if (s.includes("confirm")) return "status-confirmado";
            if (s.includes("pend")) return "status-pendente";
            if (s.includes("aten") || s.includes("alerta") || s.includes("cancel")) return "status-atencao";
            return "status-default";
        }

        // Retorna o ícone do status
        function getStatusIcon(status) {
            const s = (status || "").toLowerCase().trim();
            if (s.includes("confirm")) return "fa-circle-check";
            if (s.includes("pend")) return "fa-clock";
            if (s.includes("aten") || s.includes("alerta") || s.includes("cancel")) return "fa-triangle-exclamation";
            return "fa-circle-info";
        }

        // Renderização da escala
        function renderSchedule(monthIndex) {
            const events = scheduleData[monthIndex] || [];
            scheduleContainer.innerHTML = '';

            if (events.length === 0) {
                scheduleContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <p>Nenhuma escala cadastrada para este mês.</p>
                    </div>
                `;
                return;
            }

            events.forEach(event => {
                const card = document.createElement('article');
                card.className = 'schedule-card';
                card.setAttribute('tabindex', '0');

                // Cabeçalho: data, dia e status
                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <div class="card-date">
                        <i class="fas fa-calendar-day"></i>
                        ${event.data || ''}
                        <span class="card-day">• ${event.dia || ''}</span>
                    </div>
                    <span class="status-badge ${getStatusClass(event.status)}">
                        <i class="fas ${getStatusIcon(event.status)}"></i>
                        ${event.status || 'Sem status'}
                    </span>
                `;

                // Corpo
                const body = document.createElement('div');
                body.className = 'card-body';

                // Grid com todos os ministérios
                const grid = document.createElement('div');
                grid.className = 'ministry-grid';

                ministriesConfig.forEach(m => {
                    const people = event[m.key] || [];
                    // Pula ministérios totalmente vazios (opcional: mostrar todos)
                    if (people.length === 0 && m.key !== "palavra") {
                        // Mesmo vazio, exibe "A definir" para manter consistência visual
                    }
                    const item = document.createElement('div');
                    item.className = 'ministry-item';
                    item.setAttribute('data-role', m.key);
                    item.innerHTML = `
                        <div class="ministry-icon">
                            <i class="fas ${m.icon}"></i>
                        </div>
                        <div class="ministry-info">
                            <div class="ministry-name">${m.label}</div>
                            <div class="ministry-people">${renderPeople(people)}</div>
                        </div>
                    `;
                    grid.appendChild(item);
                });

                body.appendChild(grid);

                // Observação (se houver)
                if (event.observacao && event.observacao.trim() !== "") {
                    const obs = document.createElement('div');
                    obs.className = 'observation';
                    obs.innerHTML = `
                        <i class="fas fa-circle-info"></i>
                        <div><strong>Observação:</strong> ${event.observacao}</div>
                    `;
                    body.appendChild(obs);
                }

                card.appendChild(header);
                card.appendChild(body);
                scheduleContainer.appendChild(card);
            });
        }

        // Listeners dos botões de mês
        monthButtons.forEach(button => {
            button.addEventListener('click', () => {
                monthButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                const monthIndex = parseInt(button.dataset.month, 10);
                renderSchedule(monthIndex);
            });
        });

        // Renderiza mês inicial
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule(0);
        });
    </script>
