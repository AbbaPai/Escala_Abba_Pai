<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142448">
  <meta name="description" content="Confira a escala de ministérios da Igreja Evangélica Cristã Abba Pai.">
  <title>Escala de Ministérios | Abba Pai</title>
  <style>
    :root { color-scheme: light; --navy:#142448; --peach:#ffdbbb; --text:#192c4e; --muted:#59647b; --line:#dfe5ef; --bg:#f4f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 'Segoe UI',Arial,sans-serif; }
    .header { background:var(--navy); color:#fff; padding:28px 20px 30px; }
    .header-inner,.main,.footer-inner { max-width:900px; margin:auto; }
    .identity { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
    .logo { width:70px; height:75px; object-fit:contain; flex:none; border-radius:50%; }
    .church { margin:0; color:var(--peach); font-size:20px; font-weight:700; letter-spacing:1px; }
    .church-subtitle { margin:2px 0 0; color:#e3e9f5; font-size:13px; }
    h1 { margin:0 0 8px; font-size:clamp(25px,5vw,34px); line-height:1.2; letter-spacing:-.6px; }
    .intro { margin:0; color:#dce4f3; font-size:15px; }
    .main { padding:22px 16px 26px; }
    .status { display:flex; flex-wrap:wrap; align-items:center; gap:7px 14px; margin-bottom:22px; font-size:12px; color:var(--muted); }
    .status span:first-child::before { content:''; display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#6c826e; }
    .refresh-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .refresh-bar p { color:var(--muted); font-size:12px; margin:0; }
    .refresh-bar button { margin-top:0; }
    .active-label { display:inline-block; font-size:11px; font-weight:600; color:#244e3b; background:#e4f0e9; padding:3px 8px; border-radius:20px; margin-top:7px; }
    .notice { padding:14px 16px; margin:0 0 20px; background:#fff0dd; border:1px solid #e8ccaa; border-radius:10px; color:#654424; font-size:14px; }
    .notice p { margin:0; }
    button { font:inherit; min-height:44px; padding:8px 15px; margin-top:10px; background:var(--navy); color:#fff; border:0; border-radius:8px; cursor:pointer; }
    button:focus-visible { outline:3px solid #bc8155; outline-offset:3px; }
    button:disabled { opacity:.6; cursor:wait; }
    .loading,.empty { padding:32px 20px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:14px; color:var(--muted); }
    .month { margin-bottom:28px; }
    .month-heading { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 14px; margin-bottom:13px; }
    h2 { margin:0; font-size:20px; font-weight:650; }
    .count { font-size:13px; color:var(--muted); }
    .cards { display:grid; gap:17px; }
    .cult { background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; box-shadow:0 3px 12px #14244806; }
    .cult.next { border-top:4px solid #eaba96; }
    .cult-head { display:flex; align-items:center; gap:12px; padding:16px; background:#edf0f7; }
    .date { display:grid; justify-items:center; flex:none; min-width:53px; padding:7px 9px; background:var(--navy); border-radius:10px; color:#fff; text-transform:uppercase; font-size:11px; }
    .date strong { font-size:24px; line-height:1.2; }
    .cult-title { flex:1; min-width:0; }
    h3 { margin:0; font-size:16px; font-weight:650; overflow-wrap:anywhere; }
    .full-date { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .next-label { display:inline-block; margin-bottom:5px; font-size:11px; font-weight:650; color:#705039; }
    .roles { margin:0; padding:0 16px; }
    .role { display:grid; grid-template-columns:minmax(95px,.8fr) minmax(0,1.4fr); gap:12px; align-items:baseline; padding:13px 0; border-bottom:1px solid var(--line); }
    .role:last-child { border:0; }
    dt { margin:0; font-size:13px; color:var(--muted); }
    dd { margin:0; font-size:15px; font-weight:500; white-space:pre-line; overflow-wrap:anywhere; }
    .observation { margin:0 16px 16px; padding:11px 12px; background:#f1f3f8; border-radius:8px; font-size:14px; white-space:pre-line; overflow-wrap:anywhere; }
    .observation.ceia { background:#ffdfc3; color:#63432d; }
    .obs-label { display:block; font-size:11px; font-weight:650; margin-bottom:3px; }
    footer { padding:20px 16px 28px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; text-align:center; }
    footer p { margin:3px 0; }
    [hidden] { display:none!important; }
    @media(min-width:720px) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; } .header { padding:34px 24px; } }
    @media(max-width:360px) { .main { padding-left:10px; padding-right:10px; } .role { grid-template-columns:91px minmax(0,1fr); gap:10px; } dd { font-size:14px; } .roles { padding:0 13px; } }
    @media print { body { background:#fff; font-size:12px; } .header { padding:12px 0; color:#142448; background:#fff; } .church { color:#142448; } .church-subtitle,.intro { color:#39445a; } .identity { margin-bottom:12px; } .logo { width:50px; height:54px; } .main { padding:16px 0; } .status,.notice,footer { display:none; } .cards { display:block; } .cult { break-inside:avoid; box-shadow:none; margin-bottom:14px; } .role { padding:6px 0; } .cult-head,.observation { print-color-adjust:exact; -webkit-print-color-adjust:exact; } h2 { break-after:avoid; } }
  </style>
</head>

  <footer><div class="footer-inner"><p>Igreja Evangélica Cristã Abba Pai</p><p>Escala de Ministérios · <span id="year">2026</span></p></div></footer>
  <script>
    'use strict';
    // Para alterar a fonte dos dados, substitua somente a URL abaixo.
    const API_URL = 'https://sheetdb.io/api/v1/q90nhb3xq4i8t';
    const REFRESH_MS = 60 * 60 * 1000;
    const TIME_ZONE = 'America/Sao_Paulo';
    // Os nomes devem corresponder aos cabeçalhos da planilha.
    const MINISTRIES = ['Palavra', 'Oferta', 'Louvor', 'Intercessão', 'Recepção', 'AudioVisual', 'Mídia', 'Kids', 'Babykids'];
    const schedule = document.getElementById('schedule');
    const lastUpdate = document.getElementById('last-update');
    const nextUpdate = document.getElementById('next-update');
    const errorNotice = document.getElementById('error-notice');
    const errorMessage = document.getElementById('error-message');
    const dataNotice = document.getElementById('data-notice');
    const retry = document.getElementById('retry');
    const refreshNow = document.getElementById('refresh-now');
    let loading = false;
    let loaded = false;
    let refreshTimer = null;
    let nextRefreshAt = 0;
    let cachedRows = [];
    let renderedDay = '';

    function text(value) { return value == null ? '' : String(value).replace(/[\u200B-\u200D\uFEFF]/g, '').trim(); }
    function normalized(value) { return text(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
    function parseDate(value) {
      const raw = text(value);
      let parts = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(raw);
      let day, month, year;
      if (parts) { day = Number(parts[1]); month = Number(parts[2]); year = Number(parts[3]); }
      else {
        parts = /^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/.exec(raw);
        if (!parts) return null;
        year = Number(parts[1]); month = Number(parts[2]); day = Number(parts[3]);
      }
      if (year < 1000 || year > 9999) return null;
      const date = new Date(Date.UTC(year, month - 1, day, 12));
      if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;
      return { date, day, month, year, key: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}` };
    }
    function normalizeRows(data) {
      if (!Array.isArray(data)) throw new Error('Formato de dados inesperado');
      const rows = [];
      let rejected = 0;
      data.forEach((source, index) => {
        if (!source || typeof source !== 'object') return;
        const item = {};
        const fields = [...MINISTRIES, 'Data', 'Status', 'Observação'];
        Object.entries(source).forEach(([key, value]) => {
          const canonical = fields.find(field => normalized(field) === normalized(key));
          item[canonical || text(key)] = text(value);
        });
        if (normalized(item.Status) !== 'ativo') return;
        const parsed = parseDate(item.Data);
        if (!parsed) { rejected++; return; }
        rows.push({ ...parsed, item, index });
      });
      rows.sort((a,b) => a.key.localeCompare(b.key) || a.index - b.index);
      return { rows, rejected };
    }
    function element(tag, className, content) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (content !== undefined) node.textContent = content;
      return node;
    }
    function dateText(date, options) { return new Intl.DateTimeFormat('pt-BR', { timeZone:'UTC', ...options }).format(date); }
    function todayKey() {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone:TIME_ZONE, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
      const part = type => parts.find(value => value.type === type).value;
      return `${part('year')}-${part('month')}-${part('day')}`;
    }
    function displayValue(value) { return !text(value) || normalized(value) === 'inativo' ? '—' : text(value); }
    function makeCard(row, isNext) {
      const card = element('article', isNext ? 'cult next' : 'cult');
      const header = element('div', 'cult-head');
      const date = element('div', 'date');
      date.setAttribute('aria-hidden','true');
      date.append(element('strong', '', String(row.day).padStart(2,'0')), element('span', '', dateText(row.date, {month:'short'}).replace('.','')));
      const title = element('div', 'cult-title');
      if (isNext) title.append(element('span', 'next-label', 'Próximo culto · por data'));
      const day = dateText(row.date, {weekday:'long'});
      title.append(element('h3', '', day.charAt(0).toUpperCase() + day.slice(1)));
      const fullDate = element('time', 'full-date', dateText(row.date, {day:'2-digit', month:'long', year:'numeric'}));
      fullDate.setAttribute('datetime', row.key);
      title.append(fullDate);
      title.append(element('span','active-label','Ativo'));
      header.append(date, title);
      const roles = element('dl', 'roles');
      MINISTRIES.forEach(name => {
        const role = element('div', 'role');
        role.append(element('dt','',name), element('dd','',displayValue(row.item[name])));
        roles.append(role);
      });
      card.append(header, roles);
      const observation = displayValue(row.item['Observação']);
      if (observation !== '—') {
        const special = normalized(observation).includes('santa ceia') || observation.includes('🥖');
        const note = element('p', special ? 'observation ceia' : 'observation');
        note.append(element('span','obs-label','Observação'), element('span','',observation));
        card.append(note);
      }
      return card;
    }
    function render(rows) {
      const today = todayKey();
      renderedDay = today;
      // A escala fica visível durante todo o dia, no horário de Brasília.
      rows = rows.filter(row => row.key >= today);
      const fragment = document.createDocumentFragment();
      if (!rows.length) fragment.append(element('p','empty','Nenhuma escala ativa para hoje ou para os próximos dias.'));
      const next = rows[0];
      const months = new Map();
      rows.forEach(row => {
        const key = row.key.slice(0,7);
        if (!months.has(key)) months.set(key, []);
        months.get(key).push(row);
      });
      months.forEach((items, key) => {
        const section = element('section','month');
        const heading = element('div','month-heading');
        const name = dateText(items[0].date, {month:'long', year:'numeric'});
        const title = element('h2','',name.charAt(0).toUpperCase() + name.slice(1));
        title.id = `month-${key}`;
        section.setAttribute('aria-labelledby', title.id);
        heading.append(title, element('span','count',`${items.length} ${items.length === 1 ? 'culto' : 'cultos'}`));
        const cards = element('div','cards');
        items.forEach(row => cards.append(makeCard(row, row === next)));
        section.append(heading, cards);
        fragment.append(section);
      });
      schedule.replaceChildren(fragment);
    }
    function checkDayChange() {
      // Também remove escalas vencidas sem depender da API ou da conexão.
      if (loaded && renderedDay !== todayKey()) render(cachedRows);
    }
    function updateNextDisplay() {
      checkDayChange();
      if (!nextRefreshAt || loading) return;
      const minutes = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 60000));
      nextUpdate.textContent = minutes > 0 ? `Próxima atualização em ${minutes} min` : 'Atualização pendente';
    }
    async function loadSchedule() {
      if (loading) return;
      loading = true;
      clearTimeout(refreshTimer);
      retry.disabled = true;
      refreshNow.disabled = true;
      refreshNow.textContent = 'Atualizando…';
      schedule.setAttribute('aria-busy','true');
      nextUpdate.textContent = 'Atualizando…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch(API_URL, { signal:controller.signal, cache:'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const { rows, rejected } = normalizeRows(await response.json());
        cachedRows = rows;
        render(rows);
        loaded = true;
        errorNotice.hidden = true;
        dataNotice.hidden = rejected === 0;
        dataNotice.textContent = rejected ? `${rejected} ${rejected === 1 ? 'registro ativo não foi exibido por estar com a data inválida' : 'registros ativos não foram exibidos por estarem com datas inválidas'}. Confira a coluna Data na planilha.` : '';
        lastUpdate.textContent = 'Atualizado em ' + new Intl.DateTimeFormat('pt-BR', { timeZone:TIME_ZONE, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).format(new Date());
      } catch (error) {
        errorNotice.hidden = false;
        errorMessage.textContent = loaded ? 'Não foi possível atualizar agora. A última escala carregada continua disponível. Tentaremos novamente automaticamente.' : 'Não foi possível carregar a escala. Verifique sua conexão e tente novamente.';
        if (!loaded) {
          schedule.replaceChildren(element('p','empty','Aguardando conexão com a escala.'));
          lastUpdate.textContent = 'Escala ainda não carregada';
        }
        console.error('Falha ao consultar a escala:', error);
      } finally {
        clearTimeout(timeout);
        loading = false;
        retry.disabled = false;
        refreshNow.disabled = false;
        refreshNow.textContent = 'Atualizar agora';
        schedule.setAttribute('aria-busy','false');
        nextRefreshAt = Date.now() + REFRESH_MS;
        refreshTimer = setTimeout(loadSchedule, REFRESH_MS);
        updateNextDisplay();
      }
    }
    retry.addEventListener('click', loadSchedule);
    refreshNow.addEventListener('click', loadSchedule);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkDayChange();
      if (!document.hidden && nextRefreshAt && Date.now() >= nextRefreshAt) loadSchedule();
      else updateNextDisplay();
    });
    document.getElementById('year').textContent = new Intl.DateTimeFormat('pt-BR', {timeZone:TIME_ZONE, year:'numeric'}).format(new Date());
    setInterval(updateNextDisplay, 30000);
    loadSchedule();
  </script>
</body>
</html>
